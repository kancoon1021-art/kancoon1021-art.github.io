<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Addict</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--ink:#16161a;--sub:#6b6b75;--acc:#ff7a1a;--line:#e7e7ec}
@media (prefers-color-scheme:dark){:root{--bg:#111114;--card:#1c1c21;--ink:#f2f2f5;--sub:#a0a0ab;--line:#2c2c33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:22px 16px 10px;max-width:720px;margin:0 auto}
h1{font-size:24px;margin:0 0 6px}.note{font-size:12.5px;color:var(--sub);line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.search{margin:12px 0 4px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
main{max-width:720px;margin:0 auto;padding:0 16px 40px}
.bundle{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}.no{background:var(--acc);color:#fff;font-weight:800;border-radius:10px;padding:4px 10px;font-size:15px}
.bt{font-weight:800;font-size:17px}.date{color:var(--sub);font-size:12px;margin-left:auto}
.item{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.item img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:10px;flex:none}
.it{flex:1;min-width:0}.nm{font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:13px;color:var(--sub);margin-top:3px}.go{flex:none;background:var(--acc);color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:8px 10px}
.empty{color:var(--sub);text-align:center;padding:30px}
</style>
</head>
<body>
<header>
<h1>🛒 Cart Addict — Every Find</h1>
<div class="note">Find the number shown in the video to see the products.<br><b>As an Amazon Associate I earn from qualifying purchases. Prices and availability are accurate as of the time the video was made and are subject to change.</b></div>
<input class="search" id="q" placeholder="Search by number or product (e.g. 12, kitchen)">
</header>
<main id="list"><div class="empty">Loading…</div></main>
<script>
let DATA=[];
const won=n=>'$'+Number(n).toFixed(2);
function draw(){
  const q=document.getElementById('q').value.trim();
  const box=document.getElementById('list');
  const rows=DATA.filter(b=>!q||String(+b.id.replace(/\D/g,''))===q.replace(/^0+/,'')||b.id.includes(q)||b.category.includes(q)||b.products.some(p=>p.title.includes(q)));
  if(!rows.length){box.innerHTML=(DATA.length?'<div class="empty">No match</div>':'<div class="empty">First videos are coming soon.</div>');return}
  box.innerHTML=rows.map(b=>`<section class="bundle"><div class="bh"><span class="no">#${+b.id.replace(/\D/g,'')}</span><span class="bt">${b.category}</span><span class="date">${b.date||''}</span></div>`+
    b.products.map((p,i)=>`<a class="item" href="${p.link}" target="_blank" rel="sponsored noopener"><img src="${p.image}" alt="" loading="lazy"><div class="it"><div class="nm">${p.title}</div><div class="pr">${won(p.price)}${p.discount?` · ${p.discount}% off`:''}</div></div><span class="go">View</span></a>`).join('')+`</section>`).join('');
}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d.sort((a,b)=>b.id.localeCompare(a.id));draw()}).catch(()=>{document.getElementById('list').innerHTML='<div class="empty">First videos are coming soon.</div>'});
document.getElementById('q').addEventListener('input',draw);
const h=location.hash.replace('#','');if(h)document.getElementById('q').value=h;
</script>
</body>
</html>
